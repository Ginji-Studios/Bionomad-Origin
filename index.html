<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2839" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Bionomad · O2RIGIN</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* bordi ai lati del gioco: carta navy a quadretti con un retino leggero */
      body {
        background-color: #1c2839;
        background-image:
          radial-gradient(#26364b 1px, transparent 1.4px),
          linear-gradient(#22324a 4px, transparent 4px),
          linear-gradient(90deg, #22324a 4px, transparent 4px);
        background-size: 8px 8px, 64px 64px, 64px 64px;
        background-position: 0 0, -2px -2px, -2px -2px;
        font-family: "VT323", monospace;
      }
      body::before {
        content: "BIODOM+ · BIONOMAD · O2RIGIN · ";
        position: fixed;
        inset: auto 0 6px 0;
        color: #34485e;
        font-size: 18px;
        letter-spacing: 4px;
        white-space: nowrap;
        overflow: hidden;
        pointer-events: none;
      }

      #game {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 4px #163c4d, 0 0 0 8px #0f1a26, 0 12px 40px rgba(0, 0, 0, 0.45);
      }

      /* ---- comandi touch ---- */
      .touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .tc-btn {
        pointer-events: auto;
        font-family: "VT323", monospace;
        font-size: 22px;
        color: #f1f0ed;
        background: rgba(22, 60, 77, 0.78);
        border: 2px solid #f1f0ed;
        border-radius: 0;
        box-shadow: 4px 4px 0 rgba(15, 26, 38, 0.6);
        touch-action: none;
      }
      .tc-btn.is-down {
        background: #b4553f;
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 rgba(15, 26, 38, 0.6);
      }
      .tc-pad {
        position: absolute;
        left: calc(16px + env(safe-area-inset-left));
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 4px;
      }
      .tc-pad .up { grid-column: 2; grid-row: 1; }
      .tc-pad .left { grid-column: 1; grid-row: 2; }
      .tc-pad .right { grid-column: 3; grid-row: 2; }
      .tc-pad .down { grid-column: 2; grid-row: 3; }
      .tc-actions {
        position: absolute;
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .tc-plant {
        display: grid;
        grid-template-columns: repeat(2, 64px);
        gap: 4px;
      }
      .tc-plant .tc-btn {
        font-size: 18px;
        padding: 6px 0;
      }
      .tc-btn.big {
        width: 84px;
        height: 84px;
        font-size: 26px;
      }
      .tc-top {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .tc-btn.small {
        padding: 2px 12px;
        font-size: 20px;
      }

      /* i tasti della pianta compaiono solo durante le azioni sulla pianta */
      .tc-plant { display: none; }
      body.plant-active .tc-plant { display: grid; }

      /* telefoni in orizzontale: comandi più piccoli e trasparenti */
      @media (max-height: 500px) {
        .tc-btn { opacity: 0.7; font-size: 18px; }
        .tc-pad { grid-template-columns: repeat(3, 38px); grid-template-rows: repeat(3, 38px); gap: 2px; left: calc(6px + env(safe-area-inset-left)); bottom: 6px; }
        .tc-actions { right: calc(6px + env(safe-area-inset-right)); bottom: 6px; }
        .tc-btn.big { width: 60px; height: 60px; font-size: 20px; }
        .tc-plant { grid-template-columns: repeat(2, 52px); }
        .tc-btn.small { padding: 0 8px; font-size: 16px; }
      }

      /* telefono in verticale: si chiede di ruotarlo */
      .rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        color: #f1f0ed;
        font-size: 28px;
        text-align: center;
        background: inherit;
      }
      .rotate .phone {
        width: 46px;
        height: 80px;
        border: 4px solid #f1f0ed;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (max-width: 700px) {
        .rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="rotate">
      <div class="phone"></div>
      <div>ruota il telefono<br />per giocare</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
