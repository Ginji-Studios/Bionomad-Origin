<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bionomad Origin</title>
    <style>
      /* Font pixel locali (licenza OFL, vedi public/fonts) */
      @font-face {
        font-family: "Press Start 2P";
        src: url("/fonts/PressStart2P.woff2") format("woff2");
        font-display: block;
      }
      @font-face {
        font-family: "VT323";
        src: url("/fonts/VT323.woff2") format("woff2");
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
