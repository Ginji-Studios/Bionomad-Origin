    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: #1c2839;
        font-family: "Roboto Mono", ui-monospace, monospace;
      }
      #game {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .tc-btn {
        pointer-events: auto;
        font-family: "Roboto Mono", ui-monospace, monospace;
        font-size: 22px;
        color: #f1f0ed;
        background: rgba(28, 40, 57, 0.88);
        border: 2px solid #f1f0ed;
        border-radius: 0;
        box-shadow: 4px 4px 0 rgba(15, 26, 38, 0.6);
        touch-action: none;
      }
      .tc-btn.is-down {
        background: #5e6d88;
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 rgba(15, 26, 38, 0.6);
      }
      .tc-actions {
        position: absolute;
        right: calc(16px + env(safe-area-inset-right));
        bottom: calc(16px + env(safe-area-inset-bottom));
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .tc-plant {
        display: none;
        grid-template-columns: repeat(2, 64px);
        gap: 4px;
      }
      .tc-plant .tc-btn {
        font-size: 18px;
        padding: 6px 0;
      }
      .tc-top {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .tc-btn.small {
        padding: 2px 12px;
        font-size: 20px;
      }
      @media (max-height: 500px) {
        .tc-btn { opacity: 0.7; font-size: 18px; }
        .tc-actions { right: calc(6px + env(safe-area-inset-right)); bottom: 6px; }
        .tc-plant { grid-template-columns: repeat(2, 52px); }
        .tc-btn.small { padding: 0 8px; font-size: 16px; }
      }
      /* tablet o telefono in verticale: si chiede di ruotarlo */
      .rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        color: #f1f0ed;
        font-size: 26px;
        text-align: center;
        background: #1c2839;
      }
      .rotate .phone {
        width: 46px;
        height: 80px;
        border: 3px solid #f1f0ed;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) {
        .rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="rotate">
      <div class="phone"></div>
      <div>ruota il tablet<br />in orizzontale</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
